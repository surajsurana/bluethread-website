# Posts approved items from social/queue.json to Instagram @bluethreadai.in.
# OFF until the repo variable IG_POSTING_ENABLED is set to "true"
# (Settings > Secrets and variables > Actions > Variables). Unset = every job is skipped.
#
# Main trigger: a push to branch ig-tick. A Claude cloud routine runs
# tools/instagram/tick.sh at 09:32, 10:32 and 11:32 IST; a push starts this job within
# seconds (GitHub's own schedule ran ~7 hours late on 3-4 Nov). Every run is safe to
# repeat: the poster posts at most one due item and never the same item twice.
# A tick whose message contains [rehearse] runs a no-publish rehearsal instead.
name: Instagram post

on:
  push:
    branches: [ig-tick]
  schedule:
    - cron: "7 4 * * *"      # 09:37 IST, last-resort backup only; often hours late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (read-only token check, nothing posted)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    if: vars.IG_POSTING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REHEARSE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rehearse]') }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the queue lives on main; ig-tick only carries the trigger

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dry run
        if: env.DRY == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 tools/instagram/ig_poster.py --dry-run
          python3 tools/instagram/ig_poster.py --check-token

      - name: Rehearsal (builds the next post on Instagram, does not publish)
        if: env.REHEARSE == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 tools/instagram/ig_poster.py --rehearse

      - name: Post due, approved items
        if: env.DRY != 'true' && env.REHEARSE != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 tools/instagram/ig_poster.py --run

      - name: Commit queue status
        if: always() && env.DRY != 'true' && env.REHEARSE != 'true'
        run: |
          git config user.name "bluethread-ig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/queue.json
          if git diff --cached --quiet; then echo "queue unchanged"; exit 0; fi
          git commit -m "Instagram queue: update post status"
          for i in 1 2 3; do
            git pull --rebase && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
